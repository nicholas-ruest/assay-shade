[package]
name = "assay-shade"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Audit genomic target intervals against declared assay blind regions"
license = "MIT"
repository = "https://github.com/nicholas-ruest/assay-shade"
readme = "README.md"
keywords = ["bioinformatics", "bed", "genomics", "quality-control", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
